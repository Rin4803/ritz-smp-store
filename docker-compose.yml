version: '3.8'

services:
  db:
    image: mariadb:11.2
    container_name: ritz_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secure_root_password}
      MYSQL_DATABASE: ${DB_NAME:-ritz_smp}
      MYSQL_USER: ${DB_USER:-ritz_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_user_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - ritz_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ritz_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://${DB_USER:-ritz_user}:${DB_PASSWORD:-secure_user_password}@db:3306/${DB_NAME:-ritz_smp}
      - JWT_SECRET=${JWT_SECRET}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - DISCORD_STORE_CHANNEL_ID=${DISCORD_STORE_CHANNEL_ID}
      - DISCORD_ORDERS_CHANNEL_ID=${DISCORD_ORDERS_CHANNEL_ID}
      - DISCORD_DONATE_LOG_CHANNEL_ID=${DISCORD_DONATE_LOG_CHANNEL_ID}
      - DISCORD_SUPPORT_CHANNEL_ID=${DISCORD_SUPPORT_CHANNEL_ID}
      - DISCORD_ADMIN_ROLE_ID=${DISCORD_ADMIN_ROLE_ID}
      - RCON_HOST=${RCON_HOST}
      - RCON_PORT=${RCON_PORT:-25575}
      - RCON_PASSWORD=${RCON_PASSWORD}
    volumes:
      - app_storage:/app/storage
    networks:
      - ritz_net

volumes:
  mariadb_data:
  app_storage:

networks:
  ritz_net:
    driver: bridge
