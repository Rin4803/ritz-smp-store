<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#11131a"/><stop offset=".55" stop-color="#0a0c11"/><stop offset="1" stop-color="#050608"/></linearGradient>
  <linearGradient id="mount" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#252932"/><stop offset="1" stop-color="#0d0f14"/></linearGradient>
  <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd66a"/><stop offset=".35" stop-color="#e98b2e"/><stop offset="1" stop-color="#7d211c"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#f4b94f" stop-opacity=".22"/><stop offset="1" stop-color="#f4b94f" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M0 63.5H64M63.5 0V64" stroke="#fff" stroke-opacity=".018"/><path d="M32 0v64M0 32h64" stroke="#000" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>

<!-- understated Minecraft-like block terrain; no generated character/scene -->
<path d="M0 570 170 490 330 545 470 420 650 515 790 445 960 535 1110 410 1270 505 1430 430 1600 505V900H0Z" fill="url(#mount)"/>
<path d="M0 655 180 585 345 635 505 515 650 610 820 545 985 625 1120 520 1300 610 1450 540 1600 600V900H0Z" fill="#090b0f"/>

<!-- distant fortress blocks -->
<g fill="#15181e" stroke="#2a2d34" stroke-width="5">
 <path d="M285 610V455h88v-74h58v74h68v-120h66v120h78v155z"/>
 <path d="M870 610V405h78v-86h62v86h62V285h70v120h75v205z"/>
</g>
<g fill="#090b0f">
 <rect x="312" y="480" width="36" height="52"/><rect x="397" y="452" width="34" height="57"/><rect x="487" y="425" width="38" height="62"/>
 <rect x="900" y="435" width="34" height="56"/><rect x="995" y="382" width="36" height="62"/><rect x="1082" y="350" width="39" height="67"/>
</g>

<!-- central warm light -->
<ellipse cx="805" cy="610" rx="390" ry="250" fill="url(#light)"/>

<!-- portal-like frame, kept intentionally simple -->
<g transform="translate(690 420)">
 <path d="M0 205V70Q115-55 230 70v135" fill="none" stroke="#6537a4" stroke-width="18" opacity=".8"/>
 <path d="M20 205V78Q115-25 210 78v127" fill="#120b20" stroke="#a052d8" stroke-width="3" opacity=".92"/>
 <path d="M43 196V88Q115 20 187 88v108" fill="#24122f"/>
 <ellipse cx="115" cy="135" rx="54" ry="72" fill="#b86bdd" opacity=".18"/>
</g>

<!-- foreground block platforms -->
<g fill="#111419" stroke="#292c33" stroke-width="4">
 <path d="M0 760h360l-72 140H0z"/><path d="M1180 735h420v165h-505z"/><path d="M470 805h510l-55 95H410z"/>
</g>

<!-- lava/fire accents without a rendered character -->
<g fill="url(#fire)">
 <rect x="470" y="600" width="9" height="150" rx="4"/><rect x="535" y="570" width="7" height="178" rx="3"/>
 <rect x="1040" y="555" width="9" height="180" rx="4"/><rect x="1110" y="585" width="7" height="150" rx="3"/>
</g>

<!-- small particles -->
<g fill="#d99b45" opacity=".7"><circle cx="220" cy="290" r="2"/><circle cx="330" cy="345" r="2"/><circle cx="1190" cy="260" r="2"/><circle cx="1305" cy="355" r="2"/><circle cx="610" cy="260" r="2"/><circle cx="1010" cy="245" r="2"/></g>

<!-- strong vignette -->
<rect width="1600" height="900" fill="none" stroke="#000" stroke-width="220" opacity=".34"/>
</svg>