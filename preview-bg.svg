<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070817"/><stop offset=".45" stop-color="#24102f"/><stop offset="1" stop-color="#812b15"/></linearGradient>
<radialGradient id="sun"><stop stop-color="#fff5bf"/><stop offset=".24" stop-color="#ffc85d"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
<linearGradient id="lava" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe06d"/><stop offset=".32" stop-color="#ff7a16"/><stop offset="1" stop-color="#a91513"/></linearGradient>
<linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30283b"/><stop offset="1" stop-color="#0b0a10"/></linearGradient>
<radialGradient id="portal"><stop stop-color="#f0c9ff"/><stop offset=".3" stop-color="#b137ff"/><stop offset=".67" stop-color="#6919d9"/><stop offset="1" stop-color="#17052f"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="35"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
